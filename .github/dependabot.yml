version: 2
updates:
  - package-ecosystem: gomod
    directory: /plugins/golang-architecture/skills/go-backend-scaffold/assets/template
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
